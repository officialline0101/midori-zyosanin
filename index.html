<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約フォーム｜翠助産院</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        /* 基本スタイル */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 5px;
        }

        .container {
            background-color: #fdfdfd;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
            padding: 25px;
            box-sizing: border-box;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        h1 {
            background: linear-gradient(135deg, #13ca5e, #0e9e49);
            color: white;
            padding: 20px;
            margin: -25px -25px 20px -25px;
            text-align: center;
            font-size: 24px;
            border-radius: 12px 12px 0 0;
        }

        .label {
            background-color: #13ca5e;
            color: #ffffff;
            padding: 5px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .required {
            color: #ffeb3b;
            font-size: 0.7em;
            margin-left: 5px;
            vertical-align: middle;
            border: 1px solid #fff;
            padding: 1px 4px;
            border-radius: 3px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        /* メニューボタン */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .menu-btn {
            padding: 12px;
            background: #fff;
            border: 1px solid #13ca5e;
            color: #13ca5e;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .menu-btn:hover {
            background: #e8f5e9;
        }

        .menu-btn.active {
            background: #13ca5e;
            color: white;
            box-shadow: 0 0 0 2px #0e9e49;
        }

        /* 日時選択用のスタイル */
        .label-kibou {
            display: block;
            margin: 10px 0;
            padding: 3px 0;
            background-color: #13ca5e;
            color: #ffffff;
            font-size: 16px;
            text-align: center;
            border-radius: 4px;
        }

        .datetime-wrapper {
            margin-bottom: 15px;
            text-align: center;
        }

        .dt-grid {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .datetime-input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            background-color: #fff;
            color: #333;
            appearance: none;
        }

        .dt-grid .datetime-input {
            flex: 1 1 50%;
        }

        .time-disabled {
            opacity: 0.5;
            pointer-events: none;
            background-color: #eee;
        }

        /* 予約内容確認エリアのスタイル */
        .confirm-box {
            background-color: #f9f9f9;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
        }

        .confirm-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            border-bottom: 1px dashed #eee;
            padding-bottom: 10px;
        }

        .confirm-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .confirm-content {
            flex: 1;
        }

        .confirm-label {
            font-weight: bold;
            color: #13ca5e;
            display: block;
            margin-bottom: 2px;
        }

        .confirm-value {
            color: #333;
            white-space: pre-wrap;
        }

        .edit-button {
            background-color: #fff;
            color: #555;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 10px;
            white-space: nowrap;
        }

        .edit-button:hover {
            background-color: #13ca5e;
            color: white;
            border-color: #13ca5e;
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            background-color: #13ca5e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-button:hover {
            background-color: #0e9e49;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>翠助産院 予約フォーム</h1>

        <p style="font-size: 14px; color: #e60000; text-align: center; font-weight: bold; margin-top: -5px; margin-bottom: 15px;">
            ※ご友人と一緒にご予約をご希望の場合は、<br>LINEより直接お問い合わせください
        </p>

        <div class="label">お客様情報 <span class="required">必須</span></div>
        <div id="section-name">
            <input type="text" id="name" placeholder="お名前" oninput="saveInput(this.id)">
            <input type="tel" id="phone" placeholder="電話番号" oninput="saveInput(this.id)">
        </div>

        <div class="label">詳細情報 <span class="required">必須</span></div>
        <div id="section-detail">
            <input type="text" id="dueDate" placeholder="出産予定日（妊婦の方のみ）" onfocus="(this.type='date')"
                onblur="(this.type='text')" onchange="saveInput(this.id)">
            <input type="text" id="childName" placeholder="お子様の名前" oninput="saveInput(this.id)">
            <input type="text" id="childDob" placeholder="お子様の生年月日" onfocus="(this.type='date')"
                onblur="(this.type='text')" onchange="saveInput(this.id)">
            <input type="text" id="address" placeholder="お住まいの市町" oninput="saveInput(this.id)">

            <select id="childCount" onchange="saveInput(this.id)">
                <option value="" disabled selected>何人目のお子様ですか？</option>
                <script>
                    for (let i = 1; i <= 10; i++) document.write(`<option value="${i}人目">${i}人目</option>`);
                </script>
            </select>

            <div class="label" style="margin-top: 15px; font-size: 14px;">産後ケア事業を利用しますか？</div>
            <div class="menu-grid" style="margin-bottom:10px;">
                <button type="button" class="menu-btn sango-btn" onclick="selectSango(this, 'はい')">はい</button>
                <button type="button" class="menu-btn sango-btn" onclick="selectSango(this, 'いいえ')">いいえ</button>
                <button type="button" class="menu-btn sango-btn"
                    onclick="selectSango(this, '産前のため該当しない')">産前のため該当しない</button>
            </div>
            <input type="hidden" id="sangoCare_val">
            <p style="font-size:12px; color:#666; margin-top:5px;">
                ※産後ケア事業については<a
                    href="https://liff.line.me/1645278921-kWRPP32q/577jyhso/faq/1867357138755957?accountId=577jyhso"
                    target="_blank" style="color:#13ca5e; text-decoration:underline;">「よくある質問」</a>をご覧ください
            </p>
        </div>

        <div class="label" id="menuLabel">メニュー選択 <span class="required">必須</span></div>
        <div id="section-menu">
            <div class="menu-grid">
                <button type="button" class="menu-btn" onclick="toggleMenu(this, 'ママケア（産前・産後）')">ママケア（産前・産後）</button>
                <button type="button" class="menu-btn" onclick="toggleMenu(this, 'ベビーケア')">ベビーケア</button>
                <button type="button" class="menu-btn" onclick="toggleMenu(this, 'リラックスケア')">リラックスケア</button>
                <button type="button" class="menu-btn" onclick="toggleMenu(this, '乳房ケア')">乳房ケア</button>
            </div>
            <p style="font-size:12px; color:#666;">※個別ケアは平日のみご予約可能です。</p>
        </div>

        <div class="label-kibou" id="section-date">希望日時 <span class="required">必須</span></div>

        <div class="datetime-wrapper">
            <div style="text-align:left; font-size:14px; margin-bottom:5px; font-weight:bold; color:#13ca5e;">第1希望 <span
                    style="font-size:10px; color:#666; font-weight:normal;">※ご希望の日時に沿えない可能性がございます</span></div>
            <input type="hidden" id="date1" name="date1">
            <div class="dt-grid">
                <select id="date1_day" class="datetime-input" aria-label="日付を選択"></select>
                <select id="date1_time" class="datetime-input" aria-label="時間"></select>
            </div>
        </div>

        <div class="datetime-wrapper">
            <div style="text-align:left; font-size:14px; margin-bottom:5px; font-weight:bold; color:#13ca5e;">第2希望 <span
                    style="font-size:10px; color:#666; font-weight:normal;">※ご希望の日時に沿えない可能性がございます</span></div>
            <input type="hidden" id="date2" name="date2">
            <div class="dt-grid">
                <select id="date2_day" class="datetime-input" aria-label="日付を選択"></select>
                <select id="date2_time" class="datetime-input" aria-label="時間"></select>
            </div>
        </div>

        <div class="datetime-wrapper">
            <div style="text-align:left; font-size:14px; margin-bottom:5px; font-weight:bold; color:#13ca5e;">第3希望 <span
                    style="font-size:10px; color:#666; font-weight:normal;">※ご希望の日時に沿えない可能性がございます</span></div>
            <input type="hidden" id="date3" name="date3">
            <div class="dt-grid">
                <select id="date3_day" class="datetime-input" aria-label="日付を選択"></select>
                <select id="date3_time" class="datetime-input" aria-label="時間"></select>
            </div>
        </div>

        <br>
        <div class="label">事前に伝えておきたいことやご質問等あればご記入ください</div>
        <textarea id="message" rows="3" placeholder="ご質問等あればご記入ください" oninput="updateDisplayInfo()"></textarea>

        <div class="label" style="margin-top:30px; background-color:#333;">ご予約内容確認</div>
        <div id="displayInfo" class="confirm-box">
        </div>

        <button class="submit-button" onclick="submitForm()">予約を行う</button>

    </div>

    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script>
        let selectedMenus = [];

        // 保存機能
        function saveInput(id, val) {
            const value = val !== undefined ? val : document.getElementById(id).value;
            // hidden inputがあるならそこにもセット（Radio等用）
            if (document.getElementById(id)) document.getElementById(id).value = value;

            localStorage.setItem(id, value);
            updateDisplayInfo();
        }

        document.addEventListener('DOMContentLoaded', () => {
            liff.init({ liffId: '2008944088-QuNu9AGk' })
                .then(() => console.log('LIFF OK'))
                .catch(err => console.error(err));

            const idsToRestore = ['name', 'phone', 'dueDate', 'childName', 'childDob', 'address', 'childCount', 'sangoCare_val'];
            idsToRestore.forEach(id => {
                const savedValue = localStorage.getItem(id);
                if (savedValue && document.getElementById(id)) {
                    document.getElementById(id).value = savedValue;
                }
            });

            // 産後ケアボタン復元
            const sangoVal = localStorage.getItem('sangoCare_val');
            if (sangoVal) {
                const btns = document.querySelectorAll('.sango-btn');
                btns.forEach(btn => {
                    if (btn.textContent === sangoVal) {
                        btn.classList.add('active');
                        // hiddenにも値を入れておく
                        document.getElementById('sangoCare_val').value = sangoVal;
                    }
                });
            }

            ['date1', 'date2', 'date3'].forEach(id => initPicker(id, 60));
            updateDisplayInfo();
        });

        // メニュー選択（複数選択・最大4つ）
        function toggleMenu(btn, name) {
            if (btn.classList.contains('active')) {
                // 解除
                btn.classList.remove('active');
                selectedMenus = selectedMenus.filter(m => m !== name);
            } else {
                // 追加
                if (selectedMenus.length >= 4) {
                    alert('メニューは4つまで選択可能です');
                    return;
                }
                btn.classList.add('active');
                selectedMenus.push(name);
            }
            updateDisplayInfo();
        }

        // 産後ケア選択（単一選択）
        function selectSango(btn, val) {
            // 他のactiveを外す
            document.querySelectorAll('.sango-btn').forEach(b => b.classList.remove('active'));
            // 自身のactiveを切り替え、または常に追加（必須なら常に追加）
            // ここではクリックしたら選択状態にする
            btn.classList.add('active');

            // 値を保存
            saveInput('sangoCare_val', val);
        }

        // 日時選択ロジック
        const JP_WD = ['日', '月', '火', '水', '木', '金', '土'];
        const pad = n => String(n).padStart(2, '0');

        function buildDateOptions(selectEl, days = 60) {
            const d = new Date();
            selectEl.innerHTML = '<option value="" disabled selected>日付を選択</option>';
            for (let i = 0; i < days; i++) {
                const wd = d.getDay();
                // 土(6)・日(0)はスキップ
                if (wd === 0 || wd === 6) {
                    d.setDate(d.getDate() + 1);
                    // ループ回数を消費しないようにiをデクリメントするか、単にスキップするか。
                    // ここでは「表示可能な営業日」を60日分とするより、「直近60日の中で平日のみ」を表示する挙動にします。
                    // ただしdays=60なのでループ数固定だと日数が減りますが、十分な未来までとれればOK。
                    // もし「営業日ベースで60日」ならi--が必要ですが、カレンダー的な60日ならそのままでOK。
                    // 今回はシンプルにcontinueのみで飛ばします（表示日数は減ります）。
                    // i--; // これを有効にすると無限ループのリスク(全て休日の場合)があるので、
                    // 日付を進めるだけにしておきます。
                    continue;
                }

                const y = d.getFullYear();
                const m = pad(d.getMonth() + 1);
                const day = pad(d.getDate());
                const value = `${y}-${m}-${day}`;
                const label = `${y}/${m}/${day}（${JP_WD[wd]}）`;
                const opt = document.createElement('option');
                opt.value = value;
                opt.textContent = label;
                selectEl.appendChild(opt);
                d.setDate(d.getDate() + 1);
            }
        }

        const WEEKLY_HOURS = { start: 9, end: 16 };

        function buildHalfHourOptions(selectEl, weekday) {
            selectEl.innerHTML = '<option value="" disabled selected>時間を選択</option>';
            const start = WEEKLY_HOURS.start;
            const end = WEEKLY_HOURS.end;
            for (let h = start; h <= end; h++) {
                for (const m of [0, 30]) {
                    if (h === end && m > 0) continue;
                    const hh = pad(h);
                    const mm = pad(m);
                    const opt = document.createElement('option');
                    opt.value = `${hh}:${mm}`;
                    opt.textContent = `${hh}:${mm}`;
                    selectEl.appendChild(opt);
                }
            }
        }

        function updateHidden(baseId) {
            const day = document.getElementById(`${baseId}_day`).value;
            const time = document.getElementById(`${baseId}_time`).value;
            const hidden = document.getElementById(baseId);
            hidden.value = (day && time) ? `${day} ${time}` : "";
            updateDisplayInfo();
        }

        function initPicker(baseId, dateDays = 60) {
            const daySel = document.getElementById(`${baseId}_day`);
            const timeSel = document.getElementById(`${baseId}_time`);
            buildDateOptions(daySel, dateDays);
            timeSel.innerHTML = '<option value="" selected hidden>時間を選択</option>';
            timeSel.classList.add('time-disabled');

            daySel.addEventListener('change', () => {
                const dateVal = daySel.value;
                if (dateVal) {
                    const d = new Date(dateVal);
                    const wd = d.getDay();
                    buildHalfHourOptions(timeSel, wd);
                    timeSel.classList.remove('time-disabled');
                } else {
                    timeSel.innerHTML = '<option value="" selected hidden>時間を選択</option>';
                    timeSel.classList.add('time-disabled');
                }
                updateHidden(baseId);
            });
            timeSel.addEventListener('change', () => updateHidden(baseId));
        }

        // 表示更新・スクロール機能
        function scrollToElement(id) {
            const element = document.getElementById(id);
            if (element) {
                element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function updateDisplayInfo() {
            const name = document.getElementById('name').value || '未入力';
            const phone = document.getElementById('phone').value || '未入力';

            const dueDate = document.getElementById('dueDate').value;
            const childName = document.getElementById('childName').value;
            const childCount = document.getElementById('childCount').value;
            const sangoCare = document.getElementById('sangoCare_val') ? document.getElementById('sangoCare_val').value : '';

            let detailText = [];
            if (sangoCare) detailText.push(`産後ケア事業: ${sangoCare}`);
            if (dueDate) detailText.push(`出産予定日: ${dueDate}`);
            if (childName) detailText.push(`お子様: ${childName}`);
            if (childCount) detailText.push(`${childCount}`);
            const details = detailText.length > 0 ? detailText.join('\n') : '未入力';

            // メニュー表示
            const menuText = selectedMenus.length > 0 ? selectedMenus.join('、') : '未選択';

            const formatD = (val) => val ? val.replace(/-/g, '/').replace(' ', '日 ') : '未選択';
            const d1 = formatD(document.getElementById('date1').value);
            const d2 = formatD(document.getElementById('date2').value);
            const d3 = formatD(document.getElementById('date3').value);

            const msg = document.getElementById('message').value;

            const html = `
                <div class="confirm-row">
                    <div class="confirm-content">
                        <span class="confirm-label">お名前・電話番号</span>
                        <span class="confirm-value">${name}<br>${phone}</span>
                    </div>
                    <button class="edit-button" onclick="scrollToElement('section-name')">修正</button>
                </div>
                <div class="confirm-row">
                    <div class="confirm-content">
                        <span class="confirm-label">詳細情報</span>
                        <span class="confirm-value">${details}</span>
                    </div>
                    <button class="edit-button" onclick="scrollToElement('section-detail')">修正</button>
                </div>
                <div class="confirm-row">
                    <div class="confirm-content">
                        <span class="confirm-label">選択メニュー</span>
                        <span class="confirm-value">${menuText}</span>
                    </div>
                    <button class="edit-button" onclick="scrollToElement('menuLabel')">修正</button>
                </div>
                <div class="confirm-row">
                    <div class="confirm-content">
                        <span class="confirm-label">希望日時</span>
                        <span class="confirm-value">① ${d1}<br>② ${d2}<br>③ ${d3}</span>
                    </div>
                    <button class="edit-button" onclick="scrollToElement('section-date')">修正</button>
                </div>
                ${msg ? `
                <div class="confirm-row">
                    <div class="confirm-content">
                        <span class="confirm-label">メッセージ</span>
                        <span class="confirm-value">${msg}</span>
                    </div>
                </div>` : ''}
            `;

            document.getElementById('displayInfo').innerHTML = html;
        }

        // 送信処理
        function submitForm() {
            if (!document.getElementById('name').value) return alert('お名前を入力してください');
            if (!document.getElementById('phone').value) return alert('電話番号を入力してください');
            if (selectedMenus.length === 0) return alert('メニューを選択してください');
            if (!document.getElementById('date1').value) return alert('第1希望日時を入力してください');

            const sangoCare = document.getElementById('sangoCare_val').value || '未回答';

            const formatD = (val) => val ? val.replace(/-/g, '/').replace(' ', '日 ') : '指定なし';
            const msg = `【予約フォーム】
お名前：${document.getElementById('name').value}
電話番号：${document.getElementById('phone').value}
出産予定日：${document.getElementById('dueDate').value}
お子様の名前：${document.getElementById('childName').value}
お子様の生年月日：${document.getElementById('childDob').value}
お住い：${document.getElementById('address').value}
何人目：${document.getElementById('childCount').value}
産後ケア事業利用：${sangoCare}
カテゴリー：個別・産後ケア
メニュー：${selectedMenus.join('、')}

【希望日時】
第一希望：${formatD(document.getElementById('date1').value)}
第二希望：${formatD(document.getElementById('date2').value)}
第三希望：${formatD(document.getElementById('date3').value)}

メッセージ：${document.getElementById('message').value}`;

            if (liff.isInClient()) {
                liff.sendMessages([{ type: 'text', text: msg }])
                    .then(() => {
                        alert('予約リクエストを送信しました！');
                        liff.closeWindow();
                    })
                    .catch(e => {
                        alert('送信失敗: ' + e);
                    });
            } else {
                alert('LINEアプリ内から開いてください。\n\n送信内容確認:\n' + msg);
            }
        }
    </script>
</body>

</html>
