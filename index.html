<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約フォーム｜翠助産院</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        /* 基本スタイルは既存のものを維持しつつ、助産院用に調整 */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 5px;
        }

        .container {
            background-color: #fdfdfd;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 96%;
            max-width: 500px;
            padding: 25px;
            box-sizing: border-box;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        h1 {
            background: linear-gradient(135deg, #13ca5e, #0e9e49);
            color: white;
            padding: 20px;
            margin: -25px -25px 20px -25px;
            text-align: center;
            font-size: 24px;
            border-radius: 12px 12px 0 0;
        }

        .label {
            background-color: #13ca5e;
            color: #ffffff;
            padding: 5px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .required {
            color: #ffeb3b;
            font-size: 0.7em;
            margin-left: 5px;
            vertical-align: middle;
            border: 1px solid #fff;
            padding: 1px 4px;
            border-radius: 3px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }

        /* カテゴリ切り替えタブ */
        .category-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .category-tab {
            flex: 1;
            padding: 12px;
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 5px 5px 0 0;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            color: #555;
            transition: 0.3s;
        }

        .category-tab.active {
            background: #13ca5e;
            color: white;
            border-color: #13ca5e;
        }

        /* メニューボタン */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .menu-btn {
            padding: 12px;
            background: #fff;
            border: 1px solid #13ca5e;
            color: #13ca5e;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .menu-btn:hover {
            background: #e8f5e9;
        }

        .menu-btn.active {
            background: #13ca5e;
            color: white;
            box-shadow: 0 0 0 2px #0e9e49;
        }

        .class-menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .class-option-btn {
            text-align: left;
            line-height: 1.5;
        }

        .helper-text {
            font-size: 12px;
            color: #666;
            margin: -5px 0 15px;
        }

        .datetime-wrapper {
            position: relative;
            text-align: center;
            margin-bottom: 10px;
        }

        .placeholder {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .dt-grid {
            display: flex;
            gap: 8px;
        }

        .dt-grid .datetime-input {
            flex: 1 1 auto;
            padding: 14px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fff;
            appearance: none;
        }

        .datetime-input:focus {
            outline: none;
            border-color: #13ca5e;
            box-shadow: 0 0 0 3px rgba(19, 202, 94, 0.15);
        }

        .selection-note {
            background: #f7fbf8;
            border: 1px solid #d8efe0;
            border-radius: 6px;
            color: #246c43;
            font-size: 13px;
            padding: 10px 12px;
            margin-bottom: 15px;
        }

        .event-info-box {
            background: #fffdf5;
            border: 1px solid #eadfbd;
            border-radius: 8px;
            color: #4a3b16;
            font-size: 13px;
            line-height: 1.7;
            padding: 12px;
            margin-bottom: 15px;
        }

        .event-info-box strong {
            display: block;
            margin-bottom: 6px;
            color: #2f260e;
            font-size: 14px;
        }

        .event-info-box ul {
            margin: 6px 0 0 18px;
            padding: 0;
        }

        /* カレンダー */
        .calendar-container {
            margin-top: 20px;
        }

        .calendar table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .calendar th,
        .calendar td {
            text-align: center;
            padding: 8px 2px;
            border: 1px solid #ddd;
            font-size: 12px;
            cursor: pointer;
        }

        .calendar th {
            background: #f7f7f7;
        }

        .calendar td.available {
            color: #13ca5e;
            font-weight: bold;
        }

        .calendar td.unavailable {
            background-color: #eee;
            color: #ccc;
            pointer-events: none;
        }

        .calendar td.selected {
            background-color: #13ca5e;
            color: white;
        }

        .submit-button {
            width: 100%;
            padding: 15px;
            background-color: #13ca5e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        .submit-button:hover {
            background-color: #0e9e49;
        }

        /* ローディング */
        .loading-spinner {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 999;
        }

        .section-hidden {
            display: none;
        }

        .agreement-box {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-top: 12px;
            padding: 14px 16px;
            border: 1px solid #cfe8d9;
            border-radius: 12px;
            background: linear-gradient(135deg, #f8fffb, #eefaf3);
            box-shadow: 0 6px 14px rgba(19, 202, 94, 0.08);
            color: #24543a;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .agreement-box:hover {
            border-color: #13ca5e;
            box-shadow: 0 8px 18px rgba(19, 202, 94, 0.14);
            transform: translateY(-1px);
        }

        .agreement-box input[type="checkbox"] {
            width: auto;
            margin: 4px 0 0;
            transform: scale(1.2);
            accent-color: #13ca5e;
        }

        .agreement-content {
            flex: 1;
        }

        .agreement-title {
            display: inline-block;
            margin-bottom: 6px;
            padding: 3px 9px;
            border-radius: 999px;
            background: #13ca5e;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.04em;
        }

        .agreement-text {
            font-size: 14px;
            line-height: 1.7;
        }

        .agreement-required {
            color: #c62828;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .dt-grid {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>クラス・イベント<br>予約フォーム</h1>

        <p style="font-size: 14px; color: #e60000; text-align: center; font-weight: bold; margin-top: -5px; margin-bottom: 15px;">
            ※ご友人と一緒にご予約をご希望の場合は、LINEより直接お問い合わせください
        </p>

        <div class="label" id="menuLabel">メニュー選択 <span class="required">必須</span></div>


        <p style="font-size:12px; color:#666;">※開催日が決まっているメニューです。</p>

        <div id="classMenuSection">
            <div class="class-menu-grid">
                <button type="button" class="menu-btn class-option-btn" onclick="selectClassMenu(this, 'babyMama1st')">べびぃとママのクラス 1st（13時～14時30分）</button>
                <button type="button" class="menu-btn class-option-btn" onclick="selectClassMenu(this, 'babyMama2nd')">べびぃとママのクラス 2nd（15時～16時）</button>
                <button type="button" class="menu-btn class-option-btn" onclick="selectClassMenu(this, 'babyFood')">離乳食クラス（10時～11時30分）</button>
                <button type="button" class="menu-btn class-option-btn" onclick="selectClassMenu(this, 'smilePapa')">パパと赤ちゃんが笑顔になる講座（9時30分～11時）</button>
                <button type="button" class="menu-btn class-option-btn" onclick="selectClassMenu(this, 'prePapa')">プレパパ・パパ交流会（9時30分～11時）</button>
                <button type="button" class="menu-btn class-option-btn" onclick="selectClassMenu(this, 'grandParent')">おまご育て講座（13時30分～14時30分）</button>
                <button type="button" class="menu-btn class-option-btn" onclick="selectClassMenu(this, 'flowerArrangement')">フラワーアレンジメントの会（13時30分～15時）</button>
                <button type="button" class="menu-btn class-option-btn" onclick="selectClassMenu(this, 'pregnancyTalk')">ママもパパも知っておきたい妊娠・出産・産後のお話会（10時～11時30分）</button>
                <button type="button" class="menu-btn class-option-btn" onclick="selectClassMenu(this, 'professionalCare')">切れ目ない支援を実現させるための助産ケア（13時～15時）</button>
            </div>
        </div>

        <div class="label">希望日時 <span class="required">必須</span></div>

        <div id="classDateSection" class="section-hidden">
            <div class="datetime-wrapper">
                <span class="placeholder" id="classDatePlaceholder">⇩タップして日付を入力⇩</span>
                <input type="hidden" id="classDateValue">
                <div class="dt-grid">
                    <select id="classDateSelect" class="datetime-input" aria-label="クラス日付を選択">
                        <option value="" selected>日付を選択</option>
                    </select>
                </div>
            </div>
            <div id="classTimeInfo" class="selection-note section-hidden"></div>
            <div id="classEventInfo" class="event-info-box section-hidden"></div>
        </div>

        <div id="calendarSection" class="section-hidden">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <button type="button" onclick="changeWeek(-1)">Start ⇦ 前週</button>
                <span id="currentMonthLabel" style="font-weight:bold; padding-top:5px;">--月</span>
                <button type="button" onclick="changeWeek(1)">翌週 ⇨ Next</button>
            </div>

            <div id="calendar" class="calendar">
                <table>
                    <thead>
                        <tr id="calendar-header">
                            <th>時間</th>
                        </tr>
                    </thead>
                    <tbody id="calendar-body">
                    </tbody>
                </table>
            </div>
        </div>

        <br>
        <div class="label">お客様情報 <span class="required">必須</span></div>
        <input type="text" id="name" placeholder="お名前" oninput="saveInput(this.id)">
        <input type="tel" id="phone" placeholder="電話番号" oninput="saveInput(this.id)">
        <div id="occupationSection" class="section-hidden">
            <input type="text" id="occupation" placeholder="参加者の所属（専門職向け講座の方のみ）" oninput="saveInput(this.id)">
        </div>

        <div class="label">詳細情報 <span class="required">必須</span></div>
        <input type="text" id="dueDate" placeholder="出産予定日（妊婦の方のみ）" onfocus="(this.type='date')"
            onblur="(this.type='text')" onchange="saveInput(this.id)">
        <input type="text" id="childName" placeholder="お子様の名前" oninput="saveInput(this.id)">
        <input type="text" id="childDob" placeholder="お子様の生年月日" onfocus="(this.type='date')" onblur="(this.type='text')"
            onchange="saveInput(this.id)">
        <input type="text" id="address" placeholder="お住まいの市町" oninput="saveInput(this.id)">

        <select id="childCount" onchange="saveInput(this.id)">
            <option value="" disabled selected>何人目のお子様ですか？</option>
            <script>
                for (let i = 1; i <= 10; i++) document.write(`<option value="${i}人目">${i}人目</option>`);
            </script>
        </select>
        <input type="text" id="fatherName" placeholder="パパのお名前（パパ参加の方のみ）" oninput="saveInput(this.id)">

        <div class="label">備考</div>
        <textarea id="message" rows="3" placeholder="ご質問等あればご記入ください"></textarea>

        <label class="agreement-box">
            <input type="checkbox" id="classDetailAgreement">
            <span class="agreement-content">
                <span class="agreement-title">ご確認ください</span>
                <span class="agreement-text">詳細はリッチメニューの「ケア・クラス詳細」をご覧ください。<span class="agreement-required">（必須）</span></span>
            </span>
        </label>

        <button class="submit-button" onclick="submitForm()">予約を行う</button>

        <div id="loading" class="loading-spinner">読み込み中...</div>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <script>
        // 設定
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzP8jazTWqHOEqfNnBPgm2qW3okzQVNRdydhVG2uZmr9p0UAHgOwIbBBycID9YRozqn/exec';

        // クラスの定員（10件以上で満員）
        const CLASS_RESERVATION_LIMIT = 10;

        const JP_WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
        const CLASS_SCHEDULES = {
            babyMama1st: {
                name: 'べびぃとママのクラス 1st（13時～14時30分）',
                duration: 90,
                startTime: '13:00',
                endTime: '14:30',
                dates: ['2026-05-11', '2026-06-08', '2026-07-06', '2026-08-03', '2026-09-07', '2026-10-05', '2027-01-18', '2027-02-08', '2027-03-08']
            },
            babyMama2nd: {
                name: 'べびぃとママのクラス 2nd（15時～16時）',
                duration: 60,
                startTime: '15:00',
                endTime: '16:00',
                dates: ['2026-05-11', '2026-06-08', '2026-07-06', '2026-08-03', '2026-09-07', '2026-10-05', '2027-01-18', '2027-02-08', '2027-03-08']
            },
            babyFood: {
                name: '離乳食クラス（10時～11時30分）',
                duration: 90,
                startTime: '10:00',
                endTime: '11:30',
                dates: ['2026-06-08', '2026-08-03', '2026-10-05', '2027-01-18', '2027-02-08']
            },
            smilePapa: {
                name: 'パパと赤ちゃんが笑顔になる講座（9時30分～11時）',
                duration: 90,
                startTime: '09:30',
                endTime: '11:00',
                dates: ['2026-06-13', '2026-08-08', '2026-10-10', '2027-02-13']
            },
            prePapa: {
                name: 'プレパパ・パパ交流会（9時30分～11時）',
                duration: 90,
                startTime: '09:30',
                endTime: '11:00',
                dates: ['2026-07-11', '2026-09-12', '2027-01-09']
            },
            grandParent: {
                name: 'おまご育て講座（13時30分～14時30分）',
                duration: 60,
                startTime: '13:30',
                endTime: '14:30',
                dates: ['2026-06-25', '2026-08-27', '2026-10-22', '2027-03-25']
            },
            flowerArrangement: {
                name: 'フラワーアレンジメントの会（13時30分～15時）',
                duration: 90,
                startTime: '13:30',
                endTime: '15:00',
                dates: ['2026-05-08'],
                info: '<strong>説明を必ずご覧ください</strong>講師の先生をお呼びしてカーネーションのフラワーアレンジメントをします。ご自分への癒しや母の日のプレゼント、玄関飾りにもおすすめです。<ul><li>対象：子育て中の方ならどなたでも、お子さん連れも可能</li><li>参加費：2,000円（材料費・お茶菓子代を含む）</li><li>持ち物：水分、動きやすい格好</li></ul>'
            },
            pregnancyTalk: {
                name: 'ママもパパも知っておきたい妊娠・出産・産後のお話会（10時～11時30分）',
                duration: 90,
                startTime: '10:00',
                endTime: '11:30',
                dates: ['2026-05-30'],
                limit: 20,
                info: '<strong>説明を必ずご覧ください</strong>和歌山県田辺市のちひろ助産院院長、大平昌子先生をお招きして、妊娠から産後、子育て、夫婦関係などのお話をしていただきます。<ul><li>対象：子育て中の方ならどなたでも、お子さん連れも可能</li><li>参加費：1,000円（材料費・お茶菓子代を含む）</li><li>持ち物：水分、お子さんのお出かけセットなど</li></ul>'
            },
            professionalCare: {
                name: '切れ目ない支援を実現させるための助産ケア（13時～15時）',
                duration: 120,
                startTime: '13:00',
                endTime: '15:00',
                dates: ['2026-05-30'],
                requiresOccupation: true,
                limit: 30,
                info: '<strong>説明を必ずご覧ください</strong>和歌山県田辺市のちひろ助産院院長、大平昌子先生をお招きして、切れ目ない支援を実現させるための助産ケアをお話いただきます。<ul><li>対象：助産師・保健師・看護師・保育士などの子育て支援関係者</li><li>参加費：3,000円</li><li>持ち物：水分、筆記用具、動きやすい格好</li></ul>'
            }
        };

        const COMMON_EVENT_INFO = '<ul><li>場所：翠助産院</li><li>駐車場：敷地内と建物側面に駐車できます。外階段から2階へお越しください。</li><li>お支払い：現金または有田市商品券が使えます。</li><li>キャンセルの場合はできるだけ早くお知らせください。</li></ul>';

        let currentCategory = 'class';
        let selectedClassKey = '';
        let selectedMenuName = '';
        let selectedDuration = 0;
        let selectedDate = '';
        let currentDate = new Date();
        currentDate.setHours(0, 0, 0, 0);

        // ▼▼▼ 保存機能の追加 ▼▼▼
        // 入力内容をローカルストレージに保存
        function saveInput(id) {
            const value = document.getElementById(id).value;
            localStorage.setItem(id, value);
        }
        // ▲▲▲ 保存機能の追加 ▲▲▲

        // 初期化
        document.addEventListener('DOMContentLoaded', () => {
            liff.init({ liffId: '2008994098-6Hq9JzUh' })
                .then(() => console.log('LIFF OK'))
                .catch(err => console.error(err));

            // ▼▼▼ 保存データの復元処理 ▼▼▼
            const idsToRestore = ['name', 'phone', 'occupation', 'dueDate', 'childName', 'childDob', 'address', 'childCount', 'fatherName'];
            idsToRestore.forEach(id => {
                const savedValue = localStorage.getItem(id);
                if (savedValue) {
                    const element = document.getElementById(id);
                    if (element) {
                        element.value = savedValue;
                    }
                }
            });
            // ▲▲▲ 保存データの復元処理 ▲▲▲

            renderCalendarHeader();
            initializeClassDateSelect();
            document.getElementById('calendarSection').classList.add('section-hidden');
            document.getElementById('classDateSection').classList.add('section-hidden');
        });

        function selectCategory(btn, category) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = category;
            selectedDate = '';
            clearCalendarSelection();
            resetClassSelection();

            const isClass = category === 'class';
            document.getElementById('classMenuSection').classList.toggle('section-hidden', !isClass);
            document.getElementById('classDateSection').classList.add('section-hidden');
            document.getElementById('calendarSection').classList.toggle('section-hidden', isClass);

            if (isClass) {
                selectedMenuName = '';
                selectedDuration = 0;
                setClassTimeInfo('');
                setClassEventInfo('');
                toggleOccupationField(false);
                return;
            }

            selectedClassKey = '';
            selectedMenuName = 'イベント';
            selectedDuration = 120;
            setClassTimeInfo('');
            setClassEventInfo('');
            toggleOccupationField(false);
            fetchAvailability();
        }

        function selectClassMenu(btn, scheduleKey) {
            document.querySelectorAll('.class-option-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const schedule = CLASS_SCHEDULES[scheduleKey];
            selectedClassKey = scheduleKey;
            selectedMenuName = schedule.name;
            selectedDuration = schedule.duration;
            selectedDate = '';

            populateClassDateOptions(schedule.dates);
            setClassTimeInfo(`開催時間：${schedule.startTime}～${schedule.endTime}`);
            setClassEventInfo(schedule.info ? schedule.info + COMMON_EVENT_INFO : '');
            toggleOccupationField(Boolean(schedule.requiresOccupation));
            document.getElementById('classDateSection').classList.remove('section-hidden');
        }

        function changeWeek(offset) {
            if (currentCategory !== 'event') return;
            currentDate.setDate(currentDate.getDate() + (offset * 7));
            renderCalendarHeader();
            fetchAvailability();
        }

        function renderCalendarHeader() {
            const headerRow = document.getElementById('calendar-header');
            while (headerRow.children.length > 1) { headerRow.removeChild(headerRow.lastChild); }

            const startDay = new Date(currentDate);
            document.getElementById('currentMonthLabel').innerText = `${startDay.getFullYear()}年${startDay.getMonth() + 1}月`;

            for (let i = 0; i < 7; i++) {
                const d = new Date(startDay);
                d.setDate(d.getDate() + i);
                const th = document.createElement('th');
                th.innerHTML = `${d.getDate()}<br>(${JP_WEEKDAYS[d.getDay()]})`;
                if (d.getDay() === 0) th.style.color = 'red'; // 日
                if (d.getDay() === 6) th.style.color = 'blue'; // 土
                headerRow.appendChild(th);
            }
        }

        async function fetchAvailability() {
            if (currentCategory !== 'event') return;
            document.getElementById('loading').style.display = 'block';

            const startTime = new Date(currentDate);
            startTime.setHours(0, 0, 0, 0);
            const endTime = new Date(startTime);
            endTime.setDate(endTime.getDate() + 7);

            const url = `${GAS_URL}?startTime=${startTime.toISOString()}&endTime=${endTime.toISOString()}&category=${currentCategory}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderCalendarBody(data);
            } catch (e) {
                console.error(e);
                alert('読み込みエラー');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderCalendarBody(availabilityMap) {
            const tbody = document.getElementById('calendar-body');
            tbody.innerHTML = '';

            const times = ['09:00', '09:30', '10:00', '10:30', '11:00', '11:30',
                '12:00', '12:30', '13:00', '13:30',
                '14:00', '14:30', '15:00', '15:30',
                '16:00', '16:30', '17:00'];

            const now = new Date(); // 現在時刻

            times.forEach(timeStr => {
                const tr = document.createElement('tr');
                const tdTime = document.createElement('td');
                tdTime.innerText = timeStr;
                tr.appendChild(tdTime);

                for (let i = 0; i < 7; i++) {
                    const cellDate = new Date(currentDate);
                    cellDate.setDate(cellDate.getDate() + i);
                    const td = document.createElement('td');

                    const slotStart = new Date(cellDate);
                    const [h, m] = timeStr.split(':').map(Number);
                    slotStart.setHours(h, m, 0, 0);

                    const menuDuration = selectedDuration || 120;
                    const requiredSlots = Math.ceil(menuDuration / 30);

                    let isAvailable = true;

                    for (let k = 0; k < requiredSlots; k++) {
                        const checkTime = new Date(slotStart);
                        checkTime.setMinutes(slotStart.getMinutes() + (k * 30));

                        const y = checkTime.getFullYear();
                        const month = ('0' + (checkTime.getMonth() + 1)).slice(-2);
                        const d = ('0' + checkTime.getDate()).slice(-2);
                        const hh = ('0' + checkTime.getHours()).slice(-2);
                        const mm = ('0' + checkTime.getMinutes()).slice(-2);
                        const key = `${y}-${month}-${d} ${hh}:${mm}`;

                        if (availabilityMap[key] !== 'OK') {
                            isAvailable = false;
                            break;
                        }
                    }

                    const slotEnd = new Date(slotStart);
                    slotEnd.setMinutes(slotStart.getMinutes() + menuDuration);

                    if (slotEnd.getDate() !== slotStart.getDate()) isAvailable = false;

                    if (slotEnd.getHours() >= 17 && slotEnd.getMinutes() > 0) isAvailable = false;
                    if (slotEnd.getHours() > 17) isAvailable = false;

                    if (slotStart < now) isAvailable = false;

                    const dayOfWeek = slotStart.getDay();
                    if (dayOfWeek === 0 || dayOfWeek === 6) isAvailable = false;

                    if (isAvailable) {
                        td.innerText = '◯';
                        td.classList.add('available');

                        const y = slotStart.getFullYear();
                        const month = ('0' + (slotStart.getMonth() + 1)).slice(-2);
                        const d = ('0' + slotStart.getDate()).slice(-2);
                        const hh = ('0' + slotStart.getHours()).slice(-2);
                        const mm = ('0' + slotStart.getMinutes()).slice(-2);
                        const startKey = `${y}-${month}-${d} ${hh}:${mm}`;

                        td.onclick = () => selectDateCell(td, startKey);
                    } else {
                        td.innerText = '✕';
                        td.classList.add('unavailable');
                    }

                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            });
        }

        function selectDateCell(td, dateStr) {
            clearCalendarSelection();
            td.classList.add('selected');
            selectedDate = dateStr;
        }

        function clearCalendarSelection() {
            document.querySelectorAll('.calendar td.selected').forEach(c => c.classList.remove('selected'));
        }

        function initializeClassDateSelect() {
            document.getElementById('classDateSelect').addEventListener('change', updateClassDateSelection);
        }

        function resetClassSelection() {
            document.querySelectorAll('.class-option-btn').forEach(b => b.classList.remove('active'));
            selectedClassKey = '';
            const classDateSelect = document.getElementById('classDateSelect');
            classDateSelect.innerHTML = '<option value="" selected>日付を選択</option>';
            classDateSelect.value = '';
            document.getElementById('classDateValue').value = '';
            document.getElementById('classDatePlaceholder').style.display = '';
            selectedDate = '';
            setClassEventInfo('');
            toggleOccupationField(false);
        }

        function populateClassDateOptions(dates) {
            const selectEl = document.getElementById('classDateSelect');
            selectEl.innerHTML = '<option value="" selected>日付を選択</option>';

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            dates.forEach(dateStr => {
                const date = new Date(`${dateStr}T00:00:00`);
                const label = `${date.getFullYear()}/${String(date.getMonth() + 1).padStart(2, '0')}/${String(date.getDate()).padStart(2, '0')}（${JP_WEEKDAYS[date.getDay()]}）`;
                const option = document.createElement('option');
                option.value = dateStr;
                option.textContent = label;
                option.setAttribute('data-iso', dateStr);
                option.setAttribute('data-label', label);

                // 当日を過ぎた日付は選択不可
                if (date < today) {
                    option.textContent = label + ' - 日にちが過ぎました';
                    option.disabled = true;
                    option.value = '';
                }

                selectEl.appendChild(option);
            });

            document.getElementById('classDateValue').value = '';
            document.getElementById('classDatePlaceholder').style.display = '';

            // 未来日のみGoogleカレンダーで満員判定
            const futureDates = dates.filter(d => new Date(`${d}T00:00:00`) >= today);
            checkClassDateCapacity(futureDates, selectedMenuName);
        }

        async function checkClassDateCapacity(dates, menuName) {
            const selectEl = document.getElementById('classDateSelect');
            if (!menuName || !dates || dates.length === 0) return;

            const sortedDates = [...dates].sort();
            selectEl.disabled = true;
            selectEl.style.opacity = '0.5';

            try {
                const startTime = new Date(sortedDates[0] + 'T00:00:00+09:00').toISOString();
                const endTime = new Date(sortedDates[sortedDates.length - 1] + 'T23:59:59+09:00').toISOString();

                const url = `${GAS_URL}?category=eventList`
                    + `&startTime=${encodeURIComponent(startTime)}`
                    + `&endTime=${encodeURIComponent(endTime)}`;

                const res = await fetch(url);
                const events = await res.json();

                if (!Array.isArray(events)) {
                    console.error('イベント取得エラー:', events);
                    return;
                }

                // 別メニューを選び直していたら処理をスキップ
                if (menuName !== selectedMenuName) return;

                for (let i = 1; i < selectEl.options.length; i++) {
                    const option = selectEl.options[i];
                    const isoDate = option.getAttribute('data-iso');
                    const originalLabel = option.getAttribute('data-label');
                    if (!isoDate) continue;
                    if (option.disabled) continue; // 過去日などは既に無効化済み

                    const dayStart = new Date(isoDate + 'T00:00:00+09:00');
                    const dayEnd = new Date(isoDate + 'T23:59:59+09:00');

                    const count = events.filter(function (ev) {
                        if (!ev) return false;
                        // 同じメニュー名を含むイベントのみ対象（≪メニュー≫ 行で識別）
                        const desc = ev.description || '';
                        if (desc.indexOf(menuName) === -1) return false;
                        const evStart = new Date(ev.startTime);
                        return evStart >= dayStart && evStart <= dayEnd;
                    }).length;

                    const menuLimit = (CLASS_SCHEDULES[selectedClassKey] && CLASS_SCHEDULES[selectedClassKey].limit) || CLASS_RESERVATION_LIMIT;
                    console.log(isoDate + ' の「' + menuName + '」予約数: ' + count + '/' + menuLimit);

                    if (count >= menuLimit) {
                        option.textContent = originalLabel + ' - 満員になりました';
                        option.disabled = true;
                        option.value = ''; // 選択できないように値をクリア
                    }
                }
            } catch (error) {
                console.error('定員チェックエラー:', error);
            } finally {
                selectEl.disabled = false;
                selectEl.style.opacity = '1';
            }
        }

        function updateClassDateSelection() {
            const selectEl = document.getElementById('classDateSelect');
            const hiddenEl = document.getElementById('classDateValue');

            if (!selectedClassKey || !selectEl.value) {
                hiddenEl.value = '';
                selectedDate = '';
                document.getElementById('classDatePlaceholder').style.display = '';
                return;
            }

            hiddenEl.value = `${selectEl.value} ${CLASS_SCHEDULES[selectedClassKey].startTime}`;
            selectedDate = hiddenEl.value;
            document.getElementById('classDatePlaceholder').style.display = 'none';
        }

        function setClassTimeInfo(text) {
            const infoEl = document.getElementById('classTimeInfo');
            infoEl.textContent = text;
            infoEl.classList.toggle('section-hidden', !text);
        }

        function setClassEventInfo(html) {
            const infoEl = document.getElementById('classEventInfo');
            infoEl.innerHTML = html;
            infoEl.classList.toggle('section-hidden', !html);
        }

        function toggleOccupationField(show) {
            const section = document.getElementById('occupationSection');
            section.classList.toggle('section-hidden', !show);
            if (!show) document.getElementById('occupation').value = '';
        }

        function formatSelectedDate(dateStr) {
            if (!dateStr) return '';
            const [datePart, timePart] = dateStr.split(' ');
            if (!datePart || !timePart) return dateStr;

            const [year, month, day] = datePart.split('-');
            return `${year}年${parseInt(month, 10)}月${parseInt(day, 10)}日 ${timePart}`;
        }

        function submitForm() {
            if (!document.getElementById('name').value) return alert('お名前を入力してください');
            if (!document.getElementById('phone').value) return alert('電話番号を入力してください');
            if (!currentCategory) return alert('カテゴリを選択してください');
            if (!selectedMenuName) return alert(currentCategory === 'class' ? 'クラスメニューを選択してください' : 'メニューを選択してください');
            if (!selectedDate) return alert('日時を選択してください');
            if (CLASS_SCHEDULES[selectedClassKey] && CLASS_SCHEDULES[selectedClassKey].requiresOccupation && !document.getElementById('occupation').value) return alert('参加者の所属を入力してください');
            if (!document.getElementById('classDetailAgreement').checked) return alert('「ケア・クラス詳細」の確認チェックを入れてください');

            const msg = `【予約フォーム】
お名前：${document.getElementById('name').value}
電話番号：${document.getElementById('phone').value}
参加者の所属：${document.getElementById('occupation').value}
出産予定日：${document.getElementById('dueDate').value}
お子様の名前：${document.getElementById('childName').value}
お子様の生年月日：${document.getElementById('childDob').value}
お住い：${document.getElementById('address').value}
何人目：${document.getElementById('childCount').value}
パパのお名前：${document.getElementById('fatherName').value}
カテゴリー：${currentCategory === 'class' ? 'クラス・イベント' : 'イベント'}
メニュー：${selectedMenuName}
希望日時：
 ${formatSelectedDate(selectedDate)}
メッセージ：${document.getElementById('message').value}`;

            if (liff.isInClient()) {
                liff.sendMessages([{ type: 'text', text: msg }])
                    .then(() => {
                        alert('予約リクエストを送信しました！');
                        liff.closeWindow();
                    })
                    .catch(e => {
                        alert('送信失敗: ' + e);
                    });
            } else {
                alert('LINEアプリ内から開いてください。\n\n送信内容確認:\n' + msg);
            }
        }
    </script>
